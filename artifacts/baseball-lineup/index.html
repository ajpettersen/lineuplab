<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Lineup Lab — Fair Lineups for Youth Baseball &amp; Softball Coaches</title>
    <meta name="description" content="Lineup Lab helps youth baseball and softball coaches build fair rotational lineups, manage rosters, schedule games, track season stats, and run practices — with AI-assisted lineup generation and an iPad-friendly Field Display." />
    <link rel="canonical" href="https://lineup-lab-production-7c33.up.railway.app/" />

    <!-- Open Graph (Facebook, iMessage, Slack, LinkedIn, etc.) and
         Twitter Card tags. These power the rich link preview that shows
         when a coach shares the Lineup Lab URL into a text thread,
         Slack, Discord, or Facebook group. The opengraph.jpg in
         public/ is a 1280x720 promo card; swap it out there if the
         brand art changes. Like the canonical link above, these URLs
         are absolute — update them if the deployed host changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lineup Lab" />
    <meta property="og:title" content="Lineup Lab — Fair Lineups for Youth Baseball &amp; Softball Coaches" />
    <meta property="og:description" content="Build fair rotational lineups, manage rosters, schedule games, track season stats, and run practices — with AI-assisted lineup generation and an iPad-friendly Field Display." />
    <meta property="og:url" content="https://lineup-lab-production-7c33.up.railway.app/" />
    <meta property="og:image" content="https://lineup-lab-production-7c33.up.railway.app/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Lineup Lab — fair lineups, rosters, and stats for youth baseball and softball coaches" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lineup Lab — Fair Lineups for Youth Baseball &amp; Softball Coaches" />
    <meta name="twitter:description" content="Build fair rotational lineups, manage rosters, schedule games, track season stats, and run practices — with AI-assisted lineup generation." />
    <meta name="twitter:image" content="https://lineup-lab-production-7c33.up.railway.app/opengraph.jpg" />

    <!-- Structured data: helps Google render a richer search result
         (sitelinks, app-style snippet) for the public landing page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Lineup Lab",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Fair rotational lineup generator, roster manager, schedule importer, season stats tracker, and practice planner for youth baseball and softball coaches.",
        "url": "https://lineup-lab-production-7c33.up.railway.app/",
        "image": "https://lineup-lab-production-7c33.up.railway.app/opengraph.jpg",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Favicon: prefer the tiny SVG (~160 B) for tab icons; the
         PNG master is reserved for apple-touch-icon and the PWA
         manifest which need raster. Saves ~800 KB on every cold
         load vs. using icon.png as the favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon.png" />
    <!-- PWA / iOS Add-to-Home-Screen support. The web app manifest is
         injected by vite-plugin-pwa at build time; the apple-* tags
         below are what iOS Safari uses to render the installed app. -->
    <meta name="theme-color" content="#0a2552" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lineup Lab" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Single consolidated font request for every family the app
         actually uses: Bricolage Grotesque (body), Oswald (display),
         Roboto Mono (numerals), Space Mono (code/mono). Weights are
         pinned to the ones in use rather than pulling whole variable
         axes, and the fonts load here in the head — in parallel with the
         JS bundle — instead of via a render-blocking @import in
         index.css. This trims a meaningful chunk of font bytes off the
         mobile/iPad first load (previously Inter was downloaded but
         never used, and Oswald + Roboto Mono were each fetched twice). -->
    <!-- Load the font CSS ASYNCHRONOUSLY so it never blocks first paint.
         A plain `rel="stylesheet"` in <head> is render-blocking: the
         browser paints NOTHING — not even the inline boot splash below —
         until that external stylesheet finishes downloading, which on a
         phone or cold cache is the multi-second WHITE screen before the
         splash appears. The preload+onload swap downloads the CSS off the
         critical path and promotes it to a stylesheet once ready, so the
         branded splash paints on the very first frame. The splash and app
         both fall back to system fonts until the webfonts swap in
         (`display=swap`). <noscript> keeps fonts working without JS. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap"></noscript>
  </head>
  <body>
    <!-- Instant boot splash. The app's real UI doesn't paint until the
         JS bundle downloads, React mounts, Clerk does its network
         handshake, and the IndexedDB query cache rehydrates — several
         seconds on a phone or a cold cache. Without anything in #root
         the user stares at a blank screen the whole time. This inline
         markup (no external CSS/JS, so it paints on the very first
         frame) shows a branded "base runner" splash: a baseball laps the
         infield diamond while the wordmark and an indeterminate bar sit
         below. createRoot's render() replaces #root's children, so the
         splash vanishes the moment the React tree mounts — no teardown
         code needed. The navy backdrop matches the PWA manifest
         background_color (#0a2552) so a standalone launch has no color
         flash. Oswald is requested in <head> but may not be ready on the
         first frame; the wordmark falls back to system sans and swaps in
         when the font loads. prefers-reduced-motion parks the runner at
         home and stops all motion. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 38px;
        background: radial-gradient(
          110% 90% at 50% 34%,
          #14336c 0%,
          #0a2552 52%,
          #061a3d 100%
        );
      }
      #boot-splash .bs-stage {
        position: relative;
        width: 200px;
        height: 200px;
      }
      #boot-splash .bs-field {
        position: absolute;
        inset: 0;
      }
      #boot-splash .bs-field .bs-path {
        stroke-dasharray: 6 8;
        animation: bs-stitch 6s linear infinite;
      }
      #boot-splash .bs-runner {
        position: absolute;
        left: 50%;
        top: 85%;
        transform: translate(-50%, -50%);
        animation: bs-run 2.8s cubic-bezier(0.55, 0, 0.45, 1) infinite;
      }
      #boot-splash .bs-foot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      #boot-splash .bs-word {
        font-family: "Oswald", system-ui, sans-serif;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #f1f5ff;
      }
      #boot-splash .bs-word b {
        font-weight: 600;
        color: #f5b324;
      }
      #boot-splash .bs-bar {
        position: relative;
        width: 188px;
        height: 4px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      #boot-splash .bs-bar span {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 42%;
        border-radius: 4px;
        background: linear-gradient(
          90deg,
          transparent,
          #ffd56b,
          #f5b324,
          transparent
        );
        animation: bs-indeterminate 1.5s ease-in-out infinite;
      }
      @keyframes bs-run {
        0% { left: 50%; top: 85%; }
        25% { left: 85%; top: 50%; }
        50% { left: 50%; top: 15%; }
        75% { left: 15%; top: 50%; }
        100% { left: 50%; top: 85%; }
      }
      @keyframes bs-stitch {
        to { stroke-dashoffset: -200; }
      }
      @keyframes bs-indeterminate {
        0% { left: -42%; }
        100% { left: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .bs-runner,
        #boot-splash .bs-field .bs-path {
          animation: none;
        }
        #boot-splash .bs-bar span {
          animation: none;
          left: 0;
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading Lineup Lab">
        <div class="bs-stage">
          <svg class="bs-field" viewBox="0 0 200 200" fill="none" aria-hidden="true">
            <defs>
              <linearGradient id="bsgold" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#ffe08a" />
                <stop offset="55%" stop-color="#f5b324" />
                <stop offset="100%" stop-color="#d98c0b" />
              </linearGradient>
            </defs>
            <path
              class="bs-path"
              d="M100 30 L170 100 L100 170 L30 100 Z"
              fill="rgba(245,179,36,0.06)"
              stroke="url(#bsgold)"
              stroke-width="4"
              stroke-linejoin="round"
            />
            <rect x="162" y="92" width="16" height="16" rx="3" fill="url(#bsgold)" transform="rotate(45 170 100)" />
            <rect x="92" y="22" width="16" height="16" rx="3" fill="url(#bsgold)" transform="rotate(45 100 30)" />
            <rect x="22" y="92" width="16" height="16" rx="3" fill="url(#bsgold)" transform="rotate(45 30 100)" />
            <path
              d="M91 162 L109 162 L109 170 L100 178 L91 170 Z"
              fill="#ffffff"
              stroke="#d98c0b"
              stroke-width="1.5"
            />
          </svg>
          <span class="bs-runner">
            <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
              <circle cx="17" cy="17" r="14" fill="#ffffff" stroke="#d98c0b" stroke-width="2" />
              <path d="M8 11 Q17 7 26 11" stroke="#d42a2a" stroke-width="1.8" stroke-linecap="round" />
              <path d="M8 23 Q17 27 26 23" stroke="#d42a2a" stroke-width="1.8" stroke-linecap="round" />
            </svg>
          </span>
        </div>
        <div class="bs-foot">
          <div class="bs-word">Lineup <b>Lab</b></div>
          <div class="bs-bar"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
