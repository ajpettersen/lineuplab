<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <title>Lineup Lab — Fair Lineups for Youth Baseball &amp; Softball Coaches</title>
    <meta name="description" content="Lineup Lab helps youth baseball and softball coaches build fair rotational lineups, manage rosters, schedule games, track season stats, and run practices — with AI-assisted lineup generation and an iPad-friendly Field Display." />
    <link rel="canonical" href="https://lineup-lab.replit.app/" />

    <!-- Open Graph (Facebook, iMessage, Slack, LinkedIn, etc.) and
         Twitter Card tags. These power the rich link preview that shows
         when a coach shares the Lineup Lab URL into a text thread,
         Slack, Discord, or Facebook group. The opengraph.jpg in
         public/ is a 1280x720 promo card; swap it out there if the
         brand art changes. Like the canonical link above, these URLs
         are absolute — update them if the deployed host changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lineup Lab" />
    <meta property="og:title" content="Lineup Lab — Fair Lineups for Youth Baseball &amp; Softball Coaches" />
    <meta property="og:description" content="Build fair rotational lineups, manage rosters, schedule games, track season stats, and run practices — with AI-assisted lineup generation and an iPad-friendly Field Display." />
    <meta property="og:url" content="https://lineup-lab.replit.app/" />
    <meta property="og:image" content="https://lineup-lab.replit.app/opengraph.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta property="og:image:alt" content="Lineup Lab — fair lineups, rosters, and stats for youth baseball and softball coaches" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lineup Lab — Fair Lineups for Youth Baseball &amp; Softball Coaches" />
    <meta name="twitter:description" content="Build fair rotational lineups, manage rosters, schedule games, track season stats, and run practices — with AI-assisted lineup generation." />
    <meta name="twitter:image" content="https://lineup-lab.replit.app/opengraph.jpg" />

    <!-- Structured data: helps Google render a richer search result
         (sitelinks, app-style snippet) for the public landing page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Lineup Lab",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Web, iOS, Android",
        "description": "Fair rotational lineup generator, roster manager, schedule importer, season stats tracker, and practice planner for youth baseball and softball coaches.",
        "url": "https://lineup-lab.replit.app/",
        "image": "https://lineup-lab.replit.app/opengraph.jpg",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Favicon: prefer the tiny SVG (~160 B) for tab icons; the
         PNG master is reserved for apple-touch-icon and the PWA
         manifest which need raster. Saves ~800 KB on every cold
         load vs. using icon.png as the favicon. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon.png" />
    <!-- PWA / iOS Add-to-Home-Screen support. The web app manifest is
         injected by vite-plugin-pwa at build time; the apple-* tags
         below are what iOS Safari uses to render the installed app. -->
    <meta name="theme-color" content="#0a2552" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lineup Lab" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- Instant boot splash. The app's real UI doesn't paint until the
         JS bundle downloads, React mounts, Clerk does its network
         handshake, and the IndexedDB query cache rehydrates — several
         seconds on a phone or a cold cache. Without anything in #root
         the user stares at a pure white screen the whole time. This
         inline markup (no external CSS/JS, so it renders on the very
         first paint) shows a branded spinner immediately. createRoot's
         render() replaces #root's children, so the splash vanishes the
         moment the React tree mounts — no teardown code needed. Colors
         are hard-coded from the theme tokens (--background 215 30% 98%,
         --primary 220 85% 22%) so there's no light→dark flash when the
         app takes over. prefers-reduced-motion stops the spin. -->
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: hsl(215 30% 98%);
      }
      #boot-splash .boot-spinner {
        width: 28px;
        height: 28px;
        border: 3px solid hsl(220 85% 22% / 0.2);
        border-top-color: hsl(220 85% 22%);
        border-radius: 9999px;
        animation: boot-spin 0.7s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation: none;
        }
      }
    </style>
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading Lineup Lab">
        <div class="boot-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
