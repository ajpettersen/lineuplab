        playerId:
          type: integer
        attended:
          type: boolean
        notes:
          type: ["string", "null"]
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - practiceId
        - playerId
        - attended
        - recordedAt

    PracticeDetail:
      allOf:
