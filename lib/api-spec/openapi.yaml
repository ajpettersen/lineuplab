          type: integer
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        title:
          type: ["string", "null"]
        focusAreas:
          type: array
          items:
            type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PracticeBlock"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - durationMinutes
        - focusAreas
        - blocks
        - createdAt
        - updatedAt

    PracticeSummary:
      allOf:
