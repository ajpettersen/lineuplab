          format: date-time
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        imagePaths:
          type: array
          description: Object-storage paths for the screenshots the coach uploaded with the most recent import. Each is fetched via `GET /api/games/{id}/box-score/images/{idx}`.
          items:
            type: string
        batting:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              gameId:
                type: integer
              playerId:
                type: integer
              ab:
                type: integer
              hits:
                type: integer
              doubles:
                type: integer
              triples:
                type: integer
              hr:
                type: integer
              rbi:
                type: integer
              bb:
                type: integer
              k:
                type: integer
              hbp:
                type: integer
              sac:
                type: integer
              sb:
                type: integer
              runs:
                type: integer
              sourceNote:
                type: ["string", "null"]
              updatedAt:
                type: string
                format: date-time
            required:
              - id
              - gameId
              - playerId
              - ab
              - hits
              - doubles
              - triples
              - hr
              - rbi
              - bb
              - k
              - hbp
              - sac
              - sb
              - runs
              - updatedAt
        pitching:
          type: array
          items:
            $ref: "#/components/schemas/PitchCount"
      required:
        - gameId
        - importedAt
        - batting
        - pitching

    TournamentNetwork:
      type: object
      description: Cross-coach network row keyed on tournament fingerprint.
      properties:
        id: { type: integer }
        fingerprint: { type: string }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, fingerprint, displayName, createdAt]

    TournamentNetworkMember:
      type: object
      description: A tournament's membership in a network. One row per tournament.
      properties:
        id: { type: integer }
        networkId: { type: integer }
        tournamentId: { type: integer }
        userId: { type: string }
        visible:
          type: boolean
          description: Coach opted to show team name to other members. Default false.
        shareScores:
          type: boolean
          description: Coach is sharing scored games with the network. Default true.
        joinedAt: { type: string, format: date-time }
      required: [id, networkId, tournamentId, userId, visible, shareScores, joinedAt]

    TournamentNetworkMemberSummary:
      type: object
      description: Public view of a network member surfaced to other coaches.
      properties:
        tournamentId: { type: integer }
        visible: { type: boolean }
        shareScores: { type: boolean }
        teamName:
          type: ["string", "null"]
          description: Null when the member has not opted in to be visible.
        isYou: { type: boolean }
      required: [tournamentId, visible, shareScores, isYou]

    TournamentNetworkSuggestion:
      type: object
      description: A matching tournament owned by another coach who hasn't joined yet.
      properties:
        tournamentId: { type: integer }
        name: { type: string }
        teamName: { type: ["string", "null"] }
        networkId: { type: ["integer", "null"] }
      required: [tournamentId, name]

    TournamentNetworkResponse:
      type: object
      properties:
        network:
          oneOf:
            - $ref: "#/components/schemas/TournamentNetwork"
            - type: "null"
        membership:
          oneOf:
            - $ref: "#/components/schemas/TournamentNetworkMember"
            - type: "null"
        members:
          type: array
          items:
            $ref: "#/components/schemas/TournamentNetworkMemberSummary"
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/TournamentNetworkSuggestion"
      required: [members, suggestions]

    UpdateTournamentNetworkMembershipBody:
      type: object
      properties:
        visible: { type: boolean }
        shareScores: { type: boolean }
