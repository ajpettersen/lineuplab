          type: array
          items:
            $ref: "#/components/schemas/BattingLine"
        pitching:
          type: array
          items:
            $ref: "#/components/schemas/PitchingLine"
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
      required:
        - batting
        - pitching

    SaveBoxScoreBody:
      type: object
      properties:
        batting:
          type: array
          items:
            $ref: "#/components/schemas/BattingLine"
        pitching:
          type: array
          items:
            $ref: "#/components/schemas/PitchingLine"
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        markCompleted:
          type: boolean
          default: true
          description: When true (default) flips the game's status to "completed" — importing a box score implies the game is over.

    SaveBoxScoreResponse:
      type: object
