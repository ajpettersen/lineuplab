        - playerName
        - inning
        - position
        - battingOrder

    CreateGameBody:
      type: object
      properties:
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
        notes:
          type: ["string", "null"]
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
        tournamentId:
          type: ["integer", "null"]
          description: Optionally create the game already linked to a tournament.
      required:
        - opponent
        - gameDate
        - innings

    UpdateGameBody:
      type: object
      properties:
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: Set to an ISO timestamp when the coach taps "Start Game" on the field display, or to null to reset the running timer.
        notes:
          type: ["string", "null"]
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
        tournamentId:
          type: ["integer", "null"]
          description: Set to a tournaments.id to link this game into that tournament; set to null to detach.

    LineupEntry:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        inning:
          type: integer
        position:
          type: string
          description: Defensive position (P, C, 1B, 2B, 3B, SS, LF, CF, RF, Bench)
        battingOrder:
          type: ["integer", "null"]
      required:
        - id
        - gameId
        - playerId
        - playerName
        - inning
        - position

    GenerateLineupBody:
      type: object
      properties:
        availablePlayerIds:
          type: array
          items:
            type: integer
          description: IDs of players available for this game
        innings:
          type: integer
        constraints:
          $ref: "#/components/schemas/LineupConstraints"
      required:
        - availablePlayerIds
        - innings

    LineupConstraints:
      type: object
      properties:
        maxInningsPerPosition:
          type: integer
          description: Max innings any player plays the same position
          default: 2
        maxInningsBench:
          type: integer
          description: Max innings a player can sit on the bench
          default: 2
        ensureAllPositions:
          type: boolean
          description: Ensure every eligible position is covered each inning
          default: true
        pitcherRotation:
          type: boolean
          description: Automatically rotate pitcher each inning
          default: false

    SaveLineupBody:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LineupEntryInput"
      required:
        - entries

    LineupEntryInput:
      type: object
      properties:
        playerId:
          type: integer
        inning:
          type: integer
        position:
          type: string
        battingOrder:
          type: ["integer", "null"]
      required:
        - playerId
        - inning
        - position

    SeasonStats:
      type: object
      properties:
        totalGames:
          type: integer
        completedGames:
          type: integer
        totalInnings:
          type: integer
        positionDistribution:
          type: object
          description: Map of position to total innings played across team
          additionalProperties:
            type: integer
        fairnessScore:
          type: number
          description: 0-100 score indicating how equitable playing time and positions are
      required:
        - totalGames
        - completedGames
        - totalInnings
        - positionDistribution
        - fairnessScore

    PlayerStats:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        playerNumber:
          type: ["integer", "null"]
        gamesPlayed:
          type: integer
        totalInnings:
          type: integer
        benchInnings:
          type: integer
        positionInnings:
          type: object
          description: Map of position to innings played
          additionalProperties:
            type: integer
        inningsPitched:
          type: integer
      required:
        - playerId
        - playerName
        - gamesPlayed
        - totalInnings
        - benchInnings
        - positionInnings
        - inningsPitched

    DashboardTask:
      type: object
      description: An open coaching task surfaced on the dashboard.
      properties:
        id:
          type: string
          description: Stable composite key — `<gameId>:<taskType>`.
        type:
          type: string
          enum: [score, pitch_counts, box_score]
        gameId:
          type: integer
        gameDate:
          type: string
          format: date-time
        opponent:
          type: string
        link:
          type: string
          description: Relative path the Open button should navigate to (already includes any deep-link hash).
      required:
        - id
        - type
        - gameId
        - gameDate
        - opponent
        - link

    DismissDashboardTaskBody:
      type: object
      properties:
        gameId:
          type: integer
        taskType:
          type: string
          enum: [score, pitch_counts, box_score]
      required:
        - gameId
        - taskType

    RestTier:
      type: object
      description: One row of the rest-tier ladder (pitches → required days rest).
      properties:
        maxPitches:
          type: integer
          minimum: 0
          description: Inclusive upper bound of pitch totals this tier covers.
        daysRest:
          type: integer
          minimum: 0
          description: Required calendar days of rest before pitching again.
      required:
        - maxPitches
        - daysRest

    TeamSettings:
      type: object
      properties:
        userId:
          type: string
        teamName:
          type: string
        teamShortName:
          type: string
        battingStyle:
          type: string
          enum: [continuous, nine_man]
          description: |
            Continuous = every player on the roster bats. Nine-man = only the
            top 9 batters get a slot in the order.
        defaultDailyPitchMax:
          type: ["integer", "null"]
          description: Default per-pitcher daily cap for new tournaments.
        defaultTournamentPitchMax:
          type: ["integer", "null"]
          description: Default per-pitcher cap across an entire tournament weekend.
        defaultRestTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
          description: Default rest-tier ladder applied to new tournaments.
        activeFieldPositions:
          type: array
          items:
            type: string
          description: |
            Defensive positions this team uses each inning. Standard 9 is
            ["P","C","1B","2B","3B","SS","LF","CF","RF"]. A 10-player field
            swaps CF for LCF + RCF.
        usesGameChanger:
          type: boolean
          description: |
            When true, the dashboard nags the coach with a "Box score not
            imported" task for every past game whose box score hasn't been
            uploaded yet. Off by default.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - teamName
        - teamShortName
        - battingStyle
        - usesGameChanger
        - createdAt
        - updatedAt

    UpdateTeamSettingsBody:
      type: object
      properties:
        teamName:
          type: string
          minLength: 1
          maxLength: 80
        teamShortName:
          type: string
          minLength: 1
          maxLength: 20
        battingStyle:
          type: string
          enum: [continuous, nine_man]
        defaultDailyPitchMax:
          type: ["integer", "null"]
        defaultTournamentPitchMax:
          type: ["integer", "null"]
        defaultRestTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
        activeFieldPositions:
          type: array
          minItems: 9
          maxItems: 10
          items:
            type: string
            enum: [P, C, "1B", "2B", "3B", SS, LF, LCF, CF, RCF, RF]
        usesGameChanger:
          type: boolean

    UserPreferences:
      type: object
      properties:
        userId:
          type: string
        defaultInnings:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsPerPosition:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsBench:
          type: integer
          minimum: 0
          maximum: 15
        defaultEnsureAllPositions:
          type: boolean
        defaultPitcherRotation:
          type: boolean
        alwaysLockPitcherCatcher:
          type: boolean
          description: When true, the Generate Lineup UI prompts the coach to set Pitcher/Catcher locks before generating.
        showFairnessScore:
          type: boolean
          description: When false, the Dashboard Fairness Score card and Rotation Report fairness bar are hidden.
        showEquitySuggestions:
          type: boolean
          description: When false, the "Make this lineup more equitable" suggestions popup on a game's lineup view never renders.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - defaultInnings
        - defaultMaxInningsPerPosition
        - defaultMaxInningsBench
        - defaultEnsureAllPositions
        - defaultPitcherRotation
        - alwaysLockPitcherCatcher
        - showFairnessScore
        - showEquitySuggestions
        - createdAt
        - updatedAt

    Tournament:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        dailyPitchMax:
          type: ["integer", "null"]
          description: Per-pitcher daily cap for this tournament. Null = inherit team default.
        tournamentPitchMax:
          type: ["integer", "null"]
          description: Per-pitcher cap across the whole tournament. Null = inherit team default.
        restTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
          description: Rest tiers for this tournament. Null = inherit team default.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - startDate
        - endDate
        - createdAt

    TournamentSummary:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            gameCount:
              type: integer
            pitchersUsed:
              type: integer
              description: Distinct player count with at least one recorded pitch in this tournament
            totalPitches:
              type: integer
              description: Sum of pitches across all games in this tournament
          required:
            - gameCount
            - pitchersUsed
            - totalPitches

    TournamentDetail:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            games:
              type: array
              items:
                $ref: "#/components/schemas/Game"
            pitcherAvailability:
              type: array
              items:
                $ref: "#/components/schemas/PitcherAvailability"
            effectiveDailyMax:
              type: ["integer", "null"]
              description: Resolved per-pitcher daily cap (tournament > team default > null).
            effectiveTournamentMax:
              type: ["integer", "null"]
              description: Resolved per-pitcher tournament cap.
            effectiveRestTiers:
              type: array
              items:
                $ref: "#/components/schemas/RestTier"
              description: Resolved rest tiers (empty array = no rest enforcement).
          required:
            - games
            - pitcherAvailability
            - effectiveDailyMax
            - effectiveTournamentMax
            - effectiveRestTiers

    CreateTournamentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        dailyPitchMax:
          type: ["integer", "null"]
        tournamentPitchMax:
          type: ["integer", "null"]
        restTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
      required:
        - name
        - startDate
        - endDate

    UpdateTournamentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        dailyPitchMax:
          type: ["integer", "null"]
        tournamentPitchMax:
          type: ["integer", "null"]
        restTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"

    PitchCount:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        playerId:
          type: integer
        pitches:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - gameId
        - playerId
        - pitches
        - recordedAt

    UpsertPitchCountBody:
      type: object
      properties:
        playerId:
          type: integer
        pitches:
          type: integer
          minimum: 0
          maximum: 500
        notes:
          type: ["string", "null"]
      required:
        - playerId
        - pitches

    PitcherAvailability:
      type: object
      description: Per-player pitch totals + remaining-today availability for a tournament.
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        playerNumber:
          type: ["integer", "null"]
        totalPitchesInTournament:
          type: integer
        pitchesToday:
          type: integer
        pitchesAvailableToday:
          type: ["integer", "null"]
          description: |
            Pitches the pitcher may still throw today under the resolved daily cap.
            Null when no daily cap is configured (unlimited) — the UI should render
            this as "—" / "no cap" rather than zero. Otherwise an integer >= 0.
        dailyMax:
          type: ["integer", "null"]
          description: Resolved daily cap for this tournament. Null = no cap configured.
        restingUntil:
          oneOf:
            - type: "null"
            - type: object
              properties:
                availableOn:
                  type: string
                  format: date-time
                fromOutingDate:
                  type: string
                  format: date-time
                fromOutingPitches:
                  type: integer
                daysRest:
                  type: integer
              required:
                - availableOn
                - fromOutingDate
                - fromOutingPitches
                - daysRest
        outings:
          type: array
          items:
            type: object
            properties:
              gameId:
                type: integer
              date:
                type: string
                format: date-time
              pitches:
                type: integer
            required:
              - gameId
              - date
              - pitches
      required:
        - playerId
        - playerName
        - totalPitchesInTournament
        - pitchesToday
        - pitchesAvailableToday
        - dailyMax
        - outings

    UpdatePreferencesBody:
      type: object
      properties:
        defaultInnings:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsPerPosition:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsBench:
          type: integer
          minimum: 0
          maximum: 15
        defaultEnsureAllPositions:
          type: boolean
        defaultPitcherRotation:
          type: boolean
        alwaysLockPitcherCatcher:
          type: boolean
          description: When true, the Generate Lineup UI prompts the coach to set Pitcher/Catcher locks before generating.
        showFairnessScore:
          type: boolean
          description: When false, the Dashboard Fairness Score card and Rotation Report fairness bar are hidden.
        showEquitySuggestions:
          type: boolean
          description: When false, the "Make this lineup more equitable" suggestions popup on a game's lineup view never renders.

    PracticeBlock:
      type: object
      description: One time-block within a practice plan (warmup, drill, scrimmage, etc.)
      properties:
        id:
          type: string
          description: Stable client-generated UUID for React keys + drag-reorder
        orderIndex:
          type: integer
          minimum: 0
        title:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 240
        description:
          type: string
        drillType:
          type: string
          description: One of warmup | drill | scrimmage | conditioning | meeting
        focusAreas:
          type: array
          items:
            type: string
        groups:
          type: array
          description: Optional player groupings (defensive drills only — emitted by AI for infield/outfield/catching/pitching blocks).
          items:
            type: object
            properties:
              label:
                type: string
              playerNames:
                type: array
                items:
                  type: string
            required:
              - label
              - playerNames
      required:
        - id
        - orderIndex
        - title
        - durationMinutes
        - description
        - drillType
        - focusAreas

    Practice:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
        title:
          type: ["string", "null"]
        focusAreas:
          type: array
          items:
            type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PracticeBlock"
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - date
        - durationMinutes
        - focusAreas
        - blocks
        - createdAt
        - updatedAt

    PracticeSummary:
      allOf:
        - $ref: "#/components/schemas/Practice"
        - type: object
          properties:
            attendanceMarked:
              type: integer
              description: Number of players with explicit attendance row (attended OR absent)
            attendancePresent:
              type: integer
              description: Number of players marked present
          required:
            - attendanceMarked
            - attendancePresent

    PracticeAttendance:
      type: object
      properties:
        id:
          type: integer
        practiceId:
          type: integer
        playerId:
          type: integer
        attended:
          type: boolean
        notes:
          type: ["string", "null"]
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - practiceId
        - playerId
        - attended
        - recordedAt

    PracticeDetail:
      allOf:
        - $ref: "#/components/schemas/Practice"
        - type: object
          properties:
            attendance:
              type: array
              items:
                $ref: "#/components/schemas/PracticeAttendance"
          required:
            - attendance

    CreatePracticeBody:
      type: object
      properties:
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 360
        title:
          type: ["string", "null"]
          maxLength: 120
        focusAreas:
          type: array
          items:
            type: string
        notes:
          type: ["string", "null"]
      required:
        - date

    UpdatePracticeBody:
      type: object
      properties:
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 360
        title:
          type: ["string", "null"]
          maxLength: 120
        focusAreas:
          type: array
          items:
            type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PracticeBlock"
        notes:
          type: ["string", "null"]

    AttendanceEntry:
      type: object
      properties:
        playerId:
          type: integer
        attended:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - playerId
        - attended

    ReplaceAttendanceBody:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AttendanceEntry"
      required:
        - entries

    GeneratePracticePlanBody:
      type: object
      properties:
        focusAreas:
          type: array
          items:
            type: string
          minItems: 1
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 360
        ageGroup:
          type: ["string", "null"]
          description: Optional override (e.g. "10U") — falls back to team default
        coachNotes:
          type: ["string", "null"]
          description: Free-text guidance for the AI (e.g. "Sarah's first practice as catcher")
        requiredDrills:
          type: array
          description: Specific drills the coach wants guaranteed in the plan. Each entry becomes its own block.
          items:
            type: string
            maxLength: 200
          maxItems: 10
      required:
        - focusAreas
        - durationMinutes

    GeneratedPracticePlan:
