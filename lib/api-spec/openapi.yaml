        - type: object
          properties:
            attendance:
              type: array
              items:
                $ref: "#/components/schemas/PracticeAttendance"
          required:
            - attendance

    CreatePracticeBody:
      type: object
      properties:
        date:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 360
        title:
          type: ["string", "null"]
          maxLength: 120
        focusAreas:
          type: array
