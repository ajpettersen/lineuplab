        pitchingLinesSaved:
          type: integer
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
      required:
        - gameId
        - importedAt
        - battingLinesSaved
        - pitchingLinesSaved

    BoxScoreState:
      type: object
      description: "Saved state of a game's box-score import. `importedAt: null` means no import has happened yet."
      properties:
        gameId:
          type: integer
        importedAt:
          type: ["string", "null"]
          format: date-time
        ourScore:
          type: ["integer", "null"]
        opponentScore:
