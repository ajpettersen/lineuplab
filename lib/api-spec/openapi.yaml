          description: Stable client-generated UUID for React keys + drag-reorder
        orderIndex:
          type: integer
          minimum: 0
        title:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 240
        description:
          type: string
        drillType:
          type: string
          description: One of warmup | drill | scrimmage | conditioning | meeting
        focusAreas:
          type: array
          items:
            type: string
      required:
        - id
        - orderIndex
        - title
        - durationMinutes
        - description
        - drillType
        - focusAreas

    Practice:
      type: object
