openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Baseball Lineup Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player management
  - name: tournaments
    description: Tournament containers grouping multiple games
  - name: pitchCounts
    description: Per-game per-pitcher pitch count tracking
  - name: games
    description: Game management
  - name: lineups
    description: Lineup management
  - name: stats
    description: Season statistics and fairness metrics
  - name: teamSettings
    description: Per-coach team branding (team name and short name)
  - name: preferences
    description: Per-coach defaults for new games and lineup generation
  - name: practices
    description: Practice plans with AI-generated drill blocks and attendance

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid input

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game (e.g. mark as completed, set score)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/snapshot-plan:
    post:
      operationId: snapshotPlan
      tags: [games]
      summary: Snapshot the currently-saved lineup as the planned lineup
      description: Used by the post-game photo override flow when the coach picks "Keep original as plan" before replacing the saved lineup with what actually happened.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated game with planSnapshot populated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
        "409":
          description: No lineup to snapshot
    delete:
      operationId: clearPlanSnapshot
      tags: [games]
      summary: Clear the plan snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated game with planSnapshot cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found

  /games/{id}/lineup:
    get:
      operationId: getGameLineup
      tags: [lineups]
      summary: Get the lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup entries for game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"
        "404":
          description: Not found

  /games/{id}/lineup/generate:
    post:
      operationId: generateLineup
      tags: [lineups]
      summary: Generate a fair lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLineupBody"
      responses:
        "200":
          description: Generated lineup entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"
        "400":
          description: Not enough players or constraints cannot be satisfied

  /games/{id}/lineup/save:
    post:
      operationId: saveLineup
      tags: [lineups]
      summary: Save (or replace) the lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLineupBody"
      responses:
        "200":
          description: Saved lineup entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"

  /stats/season:
    get:
      operationId: getSeasonStats
      tags: [stats]
      summary: Get season-wide playing time and position fairness stats
      responses:
        "200":
          description: Season stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonStats"

  /stats/players:
    get:
      operationId: getPlayerStats
      tags: [stats]
      summary: Get per-player stats across the season
      responses:
        "200":
          description: Per-player stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerStats"

  /team-settings:
    get:
      operationId: getTeamSettings
      tags: [teamSettings]
      summary: Get the current coach's team branding (auto-creates defaults on first read)
      responses:
        "200":
          description: Team settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
    patch:
      operationId: updateTeamSettings
      tags: [teamSettings]
      summary: Update the current coach's team branding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamSettingsBody"
      responses:
        "200":
          description: Updated team settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          description: Invalid input

  /team-settings/complete-onboarding:
    post:
      operationId: completeOnboarding
      tags: [teamSettings]
      summary: Mark the first-run onboarding wizard as completed for the current coach
      responses:
        "200":
          description: Updated team settings (with onboardingCompletedAt set)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List the coach's tournaments (most recent first)
      responses:
        "200":
          description: Tournaments with rolling stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentSummary"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTournamentBody"
      responses:
        "201":
          description: Created tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament with its games and per-pitcher availability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      summary: Update a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentBody"
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      summary: Delete a tournament (linked games are detached, not deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tournaments/{id}/pool-play/extract:
    post:
      operationId: extractTournamentPoolPlay
      tags: [tournaments]
      summary: Extract pool-play standings + games from uploaded screenshots
      description: |
        Upload 1-3 phone screenshots of the tournament's published
        pool-play standings and/or schedule. The AI returns a parsed
        preview (teams + games with scores if visible). The preview is
        NOT persisted — the client edits it inline then PUTs the final
        version to `/tournaments/{id}/pool-play`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 3
              required: [files]
      responses:
        "200":
          description: Parsed pool-play preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedPoolPlay"
        "400":
          description: Bad request (no files, too many, etc.)
        "404":
          description: Tournament not found

  /tournaments/{id}/pool-play/extract-url:
    post:
      operationId: extractTournamentPoolPlayFromUrl
      tags: [tournaments]
      summary: Extract pool-play standings + games from a public tournament URL
      description: |
        Server-side fetch of a public tournament page (e.g. SportsEngine
        Tourney bracket, TourneyMachine, GameChanger) parsed via the
        same AI extractor as screenshots. Returns the same preview
        shape — the client edits inline then PUTs to
        `/tournaments/{id}/pool-play`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
              required: [url]
      responses:
        "200":
          description: Parsed pool-play preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedPoolPlay"
        "400":
          description: Bad request (bad URL, private host, non-HTML response, page too large)
        "404":
          description: Tournament not found
        "502":
          description: Failed to fetch or parse the page

  /tournaments/{id}/pool-play/format-extract:
    post:
      operationId: extractTournamentPoolPlayFormat
      tags: [tournaments]
      summary: Extract seeding/tiebreaker format from a rules screenshot
      description: |
        Upload 1-2 screenshots of the tournament's posted seeding /
        tiebreaker rules (e.g. "Top 2 advance, byes for top seed,
        tiebreakers: head-to-head, then run differential"). The AI
        returns a parsed format preview — the coach confirms before it
        is applied to the saved pool play.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  maxItems: 2
              required: [files]
      responses:
        "200":
          description: Parsed format preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedPoolPlayFormat"
        "400":
          description: Bad request (no files, too many, etc.)
        "404":
          description: Tournament not found

  /tournaments/{id}/pool-play/chat:
    post:
      operationId: chatTournamentPoolPlayFormat
      tags: [tournaments]
      summary: Conversational pool-play format intake
      description: |
        Stateless chat turn. The client sends the full conversation
        each request; the server replies with the AI's next message
        and (when confident) a structured `parsedFormat` matching
        ExtractedPoolPlayFormat. The coach reviews the parsed format
        in the dialog and clicks "Apply" to merge it into the saved
        pool play.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolPlayChatRequest"
      responses:
        "200":
          description: AI reply + optional parsed format preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolPlayChatResponse"
        "400":
          description: Validation error
        "404":
          description: Tournament not found

  /tournaments/{id}/pool-play:
    put:
      operationId: saveTournamentPoolPlay
      tags: [tournaments]
      summary: Save (or replace) the pool-play data for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PoolPlay"
      responses:
        "200":
          description: Updated pool-play + freshly computed analysis
          content:
            application/json:
              schema:
                type: object
                properties:
                  poolPlay:
                    $ref: "#/components/schemas/PoolPlay"
                  poolPlayAnalysis:
                    $ref: "#/components/schemas/PoolPlayAnalysis"
                required: [poolPlay, poolPlayAnalysis]
        "400":
          description: Validation error
        "404":
          description: Tournament not found
    delete:
      operationId: clearTournamentPoolPlay
      tags: [tournaments]
      summary: Clear the pool-play data for a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared
        "404":
          description: Tournament not found

  /tournaments/{id}/network:
    get:
      operationId: getTournamentNetwork
      tags: [tournaments]
      summary: Get tournament network state + join suggestions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Network state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentNetworkResponse"
        "404": { description: Tournament not found }
    patch:
      operationId: updateTournamentNetworkMembership
      tags: [tournaments]
      summary: Toggle visibility / score-sharing for this tournament's membership
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentNetworkMembershipBody"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentNetworkMember"
        "404": { description: Tournament not in any network }

  /tournaments/{id}/network/join:
    post:
      operationId: joinTournamentNetwork
      tags: [tournaments]
      summary: Join (or create) the network for this tournament's fingerprint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    $ref: "#/components/schemas/TournamentNetwork"
                  membership:
                    $ref: "#/components/schemas/TournamentNetworkMember"
                required: [network, membership]
        "200":
          description: Already a member (idempotent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  network:
                    $ref: "#/components/schemas/TournamentNetwork"
                  membership:
                    $ref: "#/components/schemas/TournamentNetworkMember"
                required: [network, membership]
        "400": { description: Tournament has no fingerprint }
        "409": { description: Tournament already in a different network }

  /tournaments/{id}/network/leave:
    post:
      operationId: leaveTournamentNetwork
      tags: [tournaments]
      summary: Leave the network for this tournament
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Left }

  /tournaments/{id}/network/dismiss:
    post:
      operationId: dismissTournamentNetworkSuggestions
      tags: [tournaments]
      summary: Dismiss current network join suggestions for this tournament
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Dismissed }

  /games/{id}/pitch-counts:
    get:
      operationId: getGamePitchCounts
      tags: [pitchCounts]
      summary: Get all pitch counts recorded for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pitch counts for the game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PitchCount"
    post:
      operationId: upsertGamePitchCount
      tags: [pitchCounts]
      summary: Upsert a player's pitch count for this game (one row per game+player)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPitchCountBody"
      responses:
        "200":
          description: Upserted pitch count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchCount"

  /games/{gameId}/pitch-counts/{playerId}:
    delete:
      operationId: deleteGamePitchCount
      tags: [pitchCounts]
      summary: Delete a player's pitch count for this game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/box-score:
    get:
      operationId: getBoxScore
      tags: [games]
      summary: Get the saved batting + pitching lines for a game
      description: Returns the per-(game, player) batting lines and pitch counts saved from any prior box-score import, plus the game's stored final score and the import timestamp. Use to show the import dialog's "Already imported on …" banner and pre-fill the editable preview when a coach re-opens an already-imported game.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Box score state for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoxScoreState"
        "404":
          description: Game not found
    post:
      operationId: saveBoxScore
      tags: [games]
      summary: Commit edited box-score lines for a game (idempotent per game)
      description: Replaces all per-game batting lines for this game with the supplied rows, upserts pitch counts (one row per pitcher), updates the game's final score, and stamps the import timestamp. Re-posting the same game wipes the prior batting lines first so totals never double-count.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBoxScoreBody"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveBoxScoreResponse"
        "400":
          description: Invalid payload
        "404":
          description: Game not found
    delete:
      operationId: deleteBoxScore
      tags: [games]
      summary: Clear the box-score import for a game
      description: Removes all per-game batting lines and clears the import timestamp. Pitch counts and the stored final score are intentionally left intact so the coach decides what to revert.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared
        "404":
          description: Game not found

  /games/{id}/box-score/extract:
    post:
      operationId: extractBoxScore
      tags: [games]
      summary: Extract batting + pitching lines from box-score images via AI
      description: Accepts 1–4 phone screenshots or PDFs of a box score (GameChanger or any scorebook). The AI matches names to the team's roster and returns a preview payload (batting lines, pitching lines, final score). Does NOT write to the database — the coach edits the preview and then POSTs `/box-score` to commit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: 1–4 image (PNG/JPEG/WebP) or PDF files, ≤6 MB each
                  items:
                    type: string
                    format: binary
              required:
                - files
      responses:
        "200":
          description: Extracted preview (not yet saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedBoxScore"
        "400":
          description: No files uploaded or roster is empty
        "404":
          description: Game not found
        "422":
          description: AI returned malformed response
        "502":
          description: AI extraction failed

  /practices:
    get:
      operationId: listPractices
      tags: [practices]
      summary: List practice plans (most recent first), with attendance roll-ups
      responses:
        "200":
          description: Practices with attendance roll-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeSummary"
    post:
      operationId: createPractice
      tags: [practices]
      summary: Create a practice (blocks default to empty until coach generates or adds)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePracticeBody"
      responses:
        "201":
          description: Created practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"

  /practices/{id}:
    get:
      operationId: getPractice
      tags: [practices]
      summary: Get a practice with its blocks and per-player attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Practice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeDetail"
        "404":
          description: Not found
    patch:
      operationId: updatePractice
      tags: [practices]
      summary: Update a practice's metadata or replace its blocks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePracticeBody"
      responses:
        "200":
          description: Updated practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"
        "404":
          description: Not found
    delete:
      operationId: deletePractice
      tags: [practices]
      summary: Delete a practice (attendance cascades)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /practices/{id}/attendance:
    put:
      operationId: replacePracticeAttendance
      tags: [practices]
      summary: Bulk-upsert per-player attendance for a practice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAttendanceBody"
      responses:
        "200":
          description: Updated attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeAttendance"
        "404":
          description: Not found

  /practices/{id}/generate-plan:
    post:
      operationId: generatePracticePlan
      tags: [practices]
      summary: AI-generate a time-blocked plan from focus areas + duration
      description: |
        Calls OpenAI with the active roster, focus areas, and duration, and
        returns a proposed `blocks` array. Does NOT save the plan — the coach
        reviews + saves via PATCH /practices/{id}.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePracticePlanBody"
      responses:
        "200":
          description: Proposed plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPracticePlan"
        "404":
          description: Not found
        "502":
          description: AI service unavailable

  /dashboard/tasks:
    get:
      operationId: listDashboardTasks
      tags: [dashboard]
      summary: Open-task list for the coach dashboard (scores not logged, pitch counts missing)
      description: |
        Derives a fresh list at read time from games + pitch_counts, filtered
        against task_dismissals. Cap of 20 most recent. The list intentionally
        omits dismissed tasks so the dashboard quiets down for accounts the
        coach has triaged.
      responses:
        "200":
          description: Open dashboard tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardTask"

  /dashboard/tasks/dismiss:
    post:
      operationId: dismissDashboardTask
      tags: [dashboard]
      summary: Permanently hide a (game, taskType) pair from the coach's task list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissDashboardTaskBody"
      responses:
        "204":
          description: Dismissed (or already dismissed; idempotent)
        "400":
          description: Invalid request body
        "404":
          description: Game not found

  /preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Get the current coach's preferences (auto-creates defaults on first read)
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    patch:
      operationId: updatePreferences
      tags: [preferences]
      summary: Update the current coach's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          description: Invalid input

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name "First Last", server-derived from firstName + lastName.
        firstName:
          type: string
        lastName:
          type: string
          description: May be empty for legacy single-token roster rows; new writes require it.
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
          description: List of positions this player can play
        preferredPositions:
          type: array
          items:
            type: string
          description: Player's preferred positions (subset of eligible)
        canPitch:
          type: boolean
        active:
          type: boolean
          description: Whether player is currently on the roster
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - firstName
        - lastName
        - eligiblePositions
        - preferredPositions
        - canPitch
        - active
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
        preferredPositions:
          type: array
          items:
            type: string
        canPitch:
          type: boolean
        active:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - firstName
        - lastName
        - eligiblePositions
        - preferredPositions
        - canPitch

    UpdatePlayerBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
        preferredPositions:
          type: array
          items:
            type: string
        canPitch:
          type: boolean
        active:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - firstName
        - lastName

    Game:
      type: object
      properties:
        id:
          type: integer
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
          description: Number of innings in the game
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        type:
          type: string
          enum: [game, practice, other]
          description: Event kind — distinguishes games from practices and other team events
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
          description: Competitive context for lineup generation — "tournament" favors competitiveness, "league" rebalances season plate appearances, null falls back to the global equity slider
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: Wall-clock time of the actual first pitch (coach taps "Start Game" on the field display). Null until kicked off. Distinct from gameDate (scheduled start) — used by the running game timer.
        tournamentId:
          type: ["integer", "null"]
          description: Optional FK to a tournaments row. Set when the game is part of a multi-game tournament weekend so the app can roll per-pitcher pitch counts across the tournament.
        bracketStage:
          type: ["string", "null"]
          enum: [pool, bracket, null]
          description: For tournament games — which stage this game belongs to. Drives which time-limit pair applies. Null when the game has no tournamentId.
        effectiveTimeLimits:
          oneOf:
            - type: "null"
            - type: object
              properties:
                noNewInningMinutes:
                  type: ["integer", "null"]
                hardStopMinutes:
                  type: ["integer", "null"]
              required: [noNewInningMinutes, hardStopMinutes]
          description: Server-resolved time-limit rules for this game (looked up from the parent tournament's pool vs bracket fields based on `bracketStage`). Null when the game has no `tournamentId` or the resolved pair is fully empty.
        notes:
          type: ["string", "null"]
        planSnapshot:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/PlanSnapshotEntry"
          description: Snapshot of the planned lineup taken before a post-game photo override (null when no snapshot has been taken)
        boxScoreImportedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the most recent box-score import. Null if no box score has been imported. The UI shows an "Already imported on …" banner when set.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - opponent
        - gameDate
        - innings
        - status
        - type
        - createdAt

    PlanSnapshotEntry:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        inning:
          type: integer
        position:
          type: string
        battingOrder:
          type: ["integer", "null"]
      required:
        - playerId
        - playerName
        - inning
        - position
        - battingOrder

    CreateGameBody:
      type: object
      properties:
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
        notes:
          type: ["string", "null"]
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
        tournamentId:
          type: ["integer", "null"]
          description: Optionally create the game already linked to a tournament.
      required:
        - opponent
        - gameDate
        - innings

    UpdateGameBody:
      type: object
      properties:
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: Set to an ISO timestamp when the coach taps "Start Game" on the field display, or to null to reset the running timer.
        notes:
          type: ["string", "null"]
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
        tournamentId:
          type: ["integer", "null"]
          description: Set to a tournaments.id to link this game into that tournament; set to null to detach.
        bracketStage:
          type: ["string", "null"]
          enum: [pool, bracket, null]
          description: For tournament games — switch between pool-play and bracket-play time-limit rules. Set null to clear.

    LineupEntry:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        inning:
          type: integer
        position:
          type: string
          description: Defensive position (P, C, 1B, 2B, 3B, SS, LF, CF, RF, Bench)
        battingOrder:
          type: ["integer", "null"]
      required:
        - id
        - gameId
        - playerId
        - playerName
        - inning
        - position

    GenerateLineupBody:
      type: object
      properties:
        availablePlayerIds:
          type: array
          items:
            type: integer
          description: IDs of players available for this game
        innings:
          type: integer
        constraints:
          $ref: "#/components/schemas/LineupConstraints"
      required:
        - availablePlayerIds
        - innings

    LineupConstraints:
      type: object
      properties:
        maxInningsPerPosition:
          type: integer
          description: Max innings any player plays the same position
          default: 2
        maxInningsBench:
          type: integer
          description: Max innings a player can sit on the bench
          default: 2
        ensureAllPositions:
          type: boolean
          description: Ensure every eligible position is covered each inning
          default: true
        pitcherRotation:
          type: boolean
          description: Automatically rotate pitcher each inning
          default: false

    SaveLineupBody:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LineupEntryInput"
      required:
        - entries

    LineupEntryInput:
      type: object
      properties:
        playerId:
          type: integer
        inning:
          type: integer
        position:
          type: string
        battingOrder:
          type: ["integer", "null"]
      required:
        - playerId
        - inning
        - position

    SeasonStats:
      type: object
      properties:
        totalGames:
          type: integer
        completedGames:
          type: integer
        totalInnings:
          type: integer
        positionDistribution:
          type: object
          description: Map of position to total innings played across team
          additionalProperties:
            type: integer
        fairnessScore:
          type: number
          description: 0-100 score indicating how equitable playing time and positions are
      required:
        - totalGames
        - completedGames
        - totalInnings
        - positionDistribution
        - fairnessScore

    PlayerStats:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        playerNumber:
          type: ["integer", "null"]
        gamesPlayed:
          type: integer
        totalInnings:
          type: integer
        benchInnings:
          type: integer
        positionInnings:
          type: object
          description: Map of position to innings played
          additionalProperties:
            type: integer
        inningsPitched:
          type: integer
      required:
        - playerId
        - playerName
        - gamesPlayed
        - totalInnings
        - benchInnings
        - positionInnings
        - inningsPitched

    DashboardTask:
      type: object
      description: An open coaching task surfaced on the dashboard.
      properties:
        id:
          type: string
          description: Stable composite key — `<gameId|tournamentId>:<taskType>`.
        type:
          type: string
          enum: [score, pitch_counts, box_score, tournament_network]
        gameId:
          type: integer
          nullable: true
          description: Present for game-scoped tasks (score / pitch_counts / box_score). Null for tournament-scoped tasks.
        tournamentId:
          type: integer
          nullable: true
          description: Present for tournament-scoped tasks (tournament_network).
        gameDate:
          type: string
          format: date-time
          description: Game date for game tasks, tournament start date for tournament tasks.
        opponent:
          type: string
          description: Opponent for game tasks; the tournament name for tournament tasks.
        link:
          type: string
          description: Relative path the Open button should navigate to (already includes any deep-link hash).
      required:
        - id
        - type
        - gameDate
        - opponent
        - link

    DismissDashboardTaskBody:
      type: object
      properties:
        gameId:
          type: integer
        taskType:
          type: string
          enum: [score, pitch_counts, box_score]
      required:
        - gameId
        - taskType

    RestTier:
      type: object
      description: One row of the rest-tier ladder (pitches → required days rest).
      properties:
        maxPitches:
          type: integer
          minimum: 0
          description: Inclusive upper bound of pitch totals this tier covers.
        daysRest:
          type: integer
          minimum: 0
          description: Required calendar days of rest before pitching again.
      required:
        - maxPitches
        - daysRest

    TeamSettings:
      type: object
      properties:
        userId:
          type: string
        teamName:
          type: string
        teamShortName:
          type: string
        sport:
          type: string
          enum: [baseball, basketball]
          description: |
            Which sport this team coaches. Drives positions, period label
            (innings vs quarters), on-court count, and feature gating.
            Defaults to baseball.
        battingStyle:
          type: string
          enum: [continuous, nine_man]
          description: |
            Continuous = every player on the roster bats. Nine-man = only the
            top 9 batters get a slot in the order.
        defaultDailyPitchMax:
          type: ["integer", "null"]
          description: Default per-pitcher daily cap for new tournaments.
        defaultTournamentPitchMax:
          type: ["integer", "null"]
          description: Default per-pitcher cap across an entire tournament weekend.
        defaultRestTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
          description: Default rest-tier ladder applied to new tournaments.
        activeFieldPositions:
          type: array
          items:
            type: string
          description: |
            Defensive positions this team uses each inning. Standard 9 is
            ["P","C","1B","2B","3B","SS","LF","CF","RF"]. A 10-player field
            swaps CF for LCF + RCF.
        usesGameChanger:
          type: boolean
          description: |
            When true, the dashboard nags the coach with a "Box score not
            imported" task for every past game whose box score hasn't been
            uploaded yet. Off by default.
        usesTournaments:
          type: boolean
          description: |
            When true (the default), the Events nav exposes Tournaments
            and the game-type picker offers Tournament. When false the
            tournament feature is hidden from new/edit forms and the
            top nav. Existing tournament games still render correctly.
        showSelectPositions:
          type: boolean
          description: |
            When true, the Defensive Lineup card on each game shows the
            "Select Positions" button (standard 9 vs. 10-player field).
            Off by default — most teams pick once and don't need a
            per-game switcher.
        primaryColor:
          type: ["string", "null"]
          description: |
            Per-team UI primary color override. HSL string of the form
            `"H S% L%"` (e.g. `"220 85% 22%"`) so it drops into
            `hsl(var(--primary))` directly. Null = use the app default.
        secondaryColor:
          type: ["string", "null"]
          description: |
            Per-team UI secondary/accent color override. Same format as
            primaryColor.
        depthChart:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
          description: |
            Coach-curated depth chart. Maps each defensive position code
            (e.g. "P", "1B", "SS") to an ordered list of playerIds —
            index 0 is the starter, index 1 the backup, and so on. A
            player can appear in multiple positions. Empty object = no
            depth chart configured.
        onboardingCompletedAt:
          type: ["string", "null"]
          format: date-time
          description: |
            Timestamp when the head coach finished the first-run
            onboarding wizard. Null = wizard not yet completed; the
            web client redirects head coaches to /welcome until this
            is set.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - teamName
        - teamShortName
        - battingStyle
        - usesGameChanger
        - createdAt
        - updatedAt

    UpdateTeamSettingsBody:
      type: object
      properties:
        teamName:
          type: string
          minLength: 1
          maxLength: 80
        teamShortName:
          type: string
          minLength: 1
          maxLength: 20
        sport:
          type: string
          enum: [baseball, basketball]
        battingStyle:
          type: string
          enum: [continuous, nine_man]
        defaultDailyPitchMax:
          type: ["integer", "null"]
        defaultTournamentPitchMax:
          type: ["integer", "null"]
        defaultRestTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
        activeFieldPositions:
          type: array
          minItems: 9
          maxItems: 10
          items:
            type: string
            enum: [P, C, "1B", "2B", "3B", SS, LF, LCF, CF, RCF, RF]
        usesGameChanger:
          type: boolean
        usesTournaments:
          type: boolean
        showSelectPositions:
          type: boolean
        primaryColor:
          type: ["string", "null"]
          description: HSL string `"H S% L%"`. Pass null to clear back to app default.
        secondaryColor:
          type: ["string", "null"]
          description: HSL string `"H S% L%"`. Pass null to clear back to app default.
        depthChart:
          type: object
          additionalProperties:
            type: array
            items:
              type: integer
          description: Coach-curated depth chart. Position code → ordered list of playerIds.

    UserPreferences:
      type: object
      properties:
        userId:
          type: string
        defaultInnings:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsPerPosition:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsBench:
          type: integer
          minimum: 0
          maximum: 15
        defaultEnsureAllPositions:
          type: boolean
        defaultPitcherRotation:
          type: boolean
        alwaysLockPitcherCatcher:
          type: boolean
          description: When true, the Generate Lineup UI prompts the coach to set Pitcher/Catcher locks before generating.
        showFairnessScore:
          type: boolean
          description: When false, the Dashboard Fairness Score card and Rotation Report fairness bar are hidden.
        showEquitySuggestions:
          type: boolean
          description: When false, the "Make this lineup more equitable" suggestions popup on a game's lineup view never renders.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - defaultInnings
        - defaultMaxInningsPerPosition
        - defaultMaxInningsBench
        - defaultEnsureAllPositions
        - defaultPitcherRotation
        - alwaysLockPitcherCatcher
        - showFairnessScore
        - showEquitySuggestions
        - createdAt
        - updatedAt

    Tournament:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        dailyPitchMax:
          type: ["integer", "null"]
          description: Per-pitcher daily cap for this tournament. Null = inherit team default.
        tournamentPitchMax:
          type: ["integer", "null"]
          description: Per-pitcher cap across the whole tournament. Null = inherit team default.
        restTiers:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/RestTier"
          description: Rest tiers for this tournament. Null = inherit team default.
        poolPlayNoNewInningMinutes:
          type: ["integer", "null"]
          description: Pool-play "no new inning after N minutes" rule. Null = no rule.
        poolPlayHardStopMinutes:
          type: ["integer", "null"]
          description: Pool-play hard stop (minutes). Field Display surfaces warnings — does NOT auto-finalize. Null = no rule.
        bracketNoNewInningMinutes:
          type: ["integer", "null"]
          description: Bracket-play "no new inning after N minutes" rule. Null = no rule.
        bracketHardStopMinutes:
          type: ["integer", "null"]
          description: Bracket-play hard stop (minutes). Null = no rule.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - startDate
        - endDate
        - createdAt

    TournamentSummary:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            gameCount:
              type: integer
            pitchersUsed:
              type: integer
              description: Distinct player count with at least one recorded pitch in this tournament
            totalPitches:
              type: integer
              description: Sum of pitches across all games in this tournament
          required:
            - gameCount
            - pitchersUsed
            - totalPitches

    TournamentDetail:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            games:
              type: array
              items:
                $ref: "#/components/schemas/Game"
            pitcherAvailability:
              type: array
              items:
                $ref: "#/components/schemas/PitcherAvailability"
            gameSuggestions:
              type: array
              items:
                $ref: "#/components/schemas/GamePitcherSuggestion"
              description: |
                Per-game suggested pitchers (starter + up to 2 backups) drawn
                from the team's "P" depth chart, projected against each game's
                date. Empty `pitchers` array means either the game already has
                outings logged, is in the past, or no eligible pitchers remain.
            effectiveDailyMax:
              type: ["integer", "null"]
              description: Resolved per-pitcher daily cap (tournament > team default > null).
            effectiveTournamentMax:
              type: ["integer", "null"]
              description: Resolved per-pitcher tournament cap.
            effectiveRestTiers:
              type: array
              items:
                $ref: "#/components/schemas/RestTier"
              description: Resolved rest tiers (empty array = no rest enforcement).
            poolPlay:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/PoolPlay"
              description: Saved pool-play data (null until the coach imports it).
            poolPlayAnalysis:
              oneOf:
                - type: "null"
                - $ref: "#/components/schemas/PoolPlayAnalysis"
              description: Freshly computed scenarios (null when `poolPlay` is null).
          required:
            - games
            - pitcherAvailability
            - gameSuggestions
            - effectiveDailyMax
            - effectiveTournamentMax
            - effectiveRestTiers
            - poolPlay
            - poolPlayAnalysis

