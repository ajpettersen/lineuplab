openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Baseball Lineup Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player management
  - name: tournaments
    description: Tournament containers grouping multiple games
  - name: pitchCounts
    description: Per-game per-pitcher pitch count tracking
  - name: games
    description: Game management
  - name: lineups
    description: Lineup management
  - name: stats
    description: Season statistics and fairness metrics
  - name: teamSettings
    description: Per-coach team branding (team name and short name)
  - name: preferences
    description: Per-coach defaults for new games and lineup generation
  - name: practices
    description: Practice plans with AI-generated drill blocks and attendance

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid input

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game (e.g. mark as completed, set score)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/snapshot-plan:
    post:
      operationId: snapshotPlan
      tags: [games]
      summary: Snapshot the currently-saved lineup as the planned lineup
      description: Used by the post-game photo override flow when the coach picks "Keep original as plan" before replacing the saved lineup with what actually happened.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated game with planSnapshot populated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
        "409":
          description: No lineup to snapshot
    delete:
      operationId: clearPlanSnapshot
      tags: [games]
      summary: Clear the plan snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated game with planSnapshot cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found

  /games/{id}/lineup:
    get:
      operationId: getGameLineup
      tags: [lineups]
      summary: Get the lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup entries for game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"
        "404":
          description: Not found

  /games/{id}/lineup/generate:
    post:
      operationId: generateLineup
      tags: [lineups]
      summary: Generate a fair lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLineupBody"
      responses:
        "200":
          description: Generated lineup entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"
        "400":
          description: Not enough players or constraints cannot be satisfied

  /games/{id}/lineup/save:
    post:
      operationId: saveLineup
      tags: [lineups]
      summary: Save (or replace) the lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLineupBody"
      responses:
        "200":
          description: Saved lineup entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"

  /stats/season:
    get:
      operationId: getSeasonStats
      tags: [stats]
      summary: Get season-wide playing time and position fairness stats
      responses:
        "200":
          description: Season stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonStats"

  /stats/players:
    get:
      operationId: getPlayerStats
      tags: [stats]
      summary: Get per-player stats across the season
      responses:
        "200":
          description: Per-player stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerStats"

  /team-settings:
    get:
      operationId: getTeamSettings
      tags: [teamSettings]
      summary: Get the current coach's team branding (auto-creates defaults on first read)
      responses:
        "200":
          description: Team settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
    patch:
      operationId: updateTeamSettings
      tags: [teamSettings]
      summary: Update the current coach's team branding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamSettingsBody"
      responses:
        "200":
          description: Updated team settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          description: Invalid input

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List the coach's tournaments (most recent first)
      responses:
        "200":
          description: Tournaments with rolling stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentSummary"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTournamentBody"
      responses:
        "201":
          description: Created tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament with its games and per-pitcher availability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      summary: Update a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentBody"
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      summary: Delete a tournament (linked games are detached, not deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/pitch-counts:
    get:
      operationId: getGamePitchCounts
      tags: [pitchCounts]
      summary: Get all pitch counts recorded for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pitch counts for the game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PitchCount"
    post:
      operationId: upsertGamePitchCount
      tags: [pitchCounts]
      summary: Upsert a player's pitch count for this game (one row per game+player)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPitchCountBody"
      responses:
        "200":
          description: Upserted pitch count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchCount"

  /games/{gameId}/pitch-counts/{playerId}:
    delete:
      operationId: deleteGamePitchCount
      tags: [pitchCounts]
      summary: Delete a player's pitch count for this game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /practices:
    get:
      operationId: listPractices
      tags: [practices]
      summary: List practice plans (most recent first), with attendance roll-ups
      responses:
        "200":
          description: Practices with attendance roll-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeSummary"
    post:
      operationId: createPractice
      tags: [practices]
      summary: Create a practice (blocks default to empty until coach generates or adds)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePracticeBody"
      responses:
        "201":
          description: Created practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"

  /practices/{id}:
    get:
      operationId: getPractice
      tags: [practices]
      summary: Get a practice with its blocks and per-player attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Practice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeDetail"
        "404":
          description: Not found
    patch:
      operationId: updatePractice
      tags: [practices]
      summary: Update a practice's metadata or replace its blocks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePracticeBody"
      responses:
        "200":
          description: Updated practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"
        "404":
          description: Not found
    delete:
      operationId: deletePractice
      tags: [practices]
      summary: Delete a practice (attendance cascades)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /practices/{id}/attendance:
    put:
      operationId: replacePracticeAttendance
      tags: [practices]
      summary: Bulk-upsert per-player attendance for a practice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAttendanceBody"
      responses:
        "200":
          description: Updated attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeAttendance"
        "404":
          description: Not found

  /practices/{id}/generate-plan:
    post:
      operationId: generatePracticePlan
      tags: [practices]
      summary: AI-generate a time-blocked plan from focus areas + duration
      description: |
        Calls OpenAI with the active roster, focus areas, and duration, and
        returns a proposed `blocks` array. Does NOT save the plan — the coach
        reviews + saves via PATCH /practices/{id}.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePracticePlanBody"
      responses:
        "200":
          description: Proposed plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPracticePlan"
        "404":
          description: Not found
        "502":
          description: AI service unavailable

  /preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Get the current coach's preferences (auto-creates defaults on first read)
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    patch:
      operationId: updatePreferences
      tags: [preferences]
      summary: Update the current coach's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          description: Invalid input

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
          description: List of positions this player can play
        preferredPositions:
          type: array
          items:
            type: string
          description: Player's preferred positions (subset of eligible)
        canPitch:
          type: boolean
        active:
          type: boolean
          description: Whether player is currently on the roster
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - eligiblePositions
        - preferredPositions
        - canPitch
        - active
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        name:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
        preferredPositions:
          type: array
          items:
            type: string
        canPitch:
          type: boolean
        active:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - name
        - eligiblePositions
        - preferredPositions
        - canPitch

    UpdatePlayerBody:
      type: object
      properties:
        name:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
        preferredPositions:
          type: array
          items:
            type: string
        canPitch:
          type: boolean
        active:
          type: boolean
        notes:
          type: ["string", "null"]

    Game:
      type: object
      properties:
        id:
          type: integer
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
          description: Number of innings in the game
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        type:
          type: string
          enum: [game, practice, other]
          description: Event kind — distinguishes games from practices and other team events
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
          description: Competitive context for lineup generation — "tournament" favors competitiveness, "league" rebalances season plate appearances, null falls back to the global equity slider
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: Wall-clock time of the actual first pitch (coach taps "Start Game" on the field display). Null until kicked off. Distinct from gameDate (scheduled start) — used by the running game timer.
        tournamentId:
          type: ["integer", "null"]
          description: Optional FK to a tournaments row. Set when the game is part of a multi-game tournament weekend so the app can roll per-pitcher pitch counts across the tournament.
        notes:
          type: ["string", "null"]
        planSnapshot:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/PlanSnapshotEntry"
          description: Snapshot of the planned lineup taken before a post-game photo override (null when no snapshot has been taken)
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - opponent
        - gameDate
        - innings
        - status
        - type
        - createdAt

    PlanSnapshotEntry:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        inning:
          type: integer
        position:
          type: string
        battingOrder:
          type: ["integer", "null"]
      required:
        - playerId
        - playerName
        - inning
        - position
        - battingOrder

    CreateGameBody:
      type: object
      properties:
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
        notes:
          type: ["string", "null"]
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
        tournamentId:
          type: ["integer", "null"]
          description: Optionally create the game already linked to a tournament.
      required:
        - opponent
        - gameDate
        - innings

    UpdateGameBody:
      type: object
      properties:
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: Set to an ISO timestamp when the coach taps "Start Game" on the field display, or to null to reset the running timer.
        notes:
          type: ["string", "null"]
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
        tournamentId:
          type: ["integer", "null"]
          description: Set to a tournaments.id to link this game into that tournament; set to null to detach.

    LineupEntry:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        playerId:
          type: integer
        playerName:
          type: string
        inning:
          type: integer
        position:
          type: string
          description: Defensive position (P, C, 1B, 2B, 3B, SS, LF, CF, RF, Bench)
        battingOrder:
          type: ["integer", "null"]
      required:
        - id
        - gameId
        - playerId
        - playerName
        - inning
        - position

    GenerateLineupBody:
      type: object
      properties:
        availablePlayerIds:
          type: array
          items:
            type: integer
          description: IDs of players available for this game
        innings:
          type: integer
        constraints:
          $ref: "#/components/schemas/LineupConstraints"
      required:
        - availablePlayerIds
        - innings

    LineupConstraints:
      type: object
      properties:
        maxInningsPerPosition:
          type: integer
          description: Max innings any player plays the same position
          default: 2
        maxInningsBench:
          type: integer
          description: Max innings a player can sit on the bench
          default: 2
        ensureAllPositions:
          type: boolean
          description: Ensure every eligible position is covered each inning
          default: true
        pitcherRotation:
          type: boolean
          description: Automatically rotate pitcher each inning
          default: false

    SaveLineupBody:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LineupEntryInput"
      required:
        - entries

    LineupEntryInput:
      type: object
      properties:
        playerId:
          type: integer
        inning:
          type: integer
        position:
          type: string
        battingOrder:
          type: ["integer", "null"]
      required:
        - playerId
        - inning
        - position

    SeasonStats:
      type: object
      properties:
        totalGames:
          type: integer
        completedGames:
          type: integer
        totalInnings:
          type: integer
        positionDistribution:
          type: object
          description: Map of position to total innings played across team
          additionalProperties:
            type: integer
        fairnessScore:
          type: number
          description: 0-100 score indicating how equitable playing time and positions are
      required:
        - totalGames
        - completedGames
        - totalInnings
        - positionDistribution
        - fairnessScore

    PlayerStats:
      type: object
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        playerNumber:
          type: ["integer", "null"]
        gamesPlayed:
          type: integer
        totalInnings:
          type: integer
        benchInnings:
          type: integer
        positionInnings:
          type: object
          description: Map of position to innings played
          additionalProperties:
            type: integer
        inningsPitched:
          type: integer
      required:
        - playerId
        - playerName
        - gamesPlayed
        - totalInnings
        - benchInnings
        - positionInnings
        - inningsPitched

    TeamSettings:
      type: object
      properties:
        userId:
          type: string
        teamName:
          type: string
        teamShortName:
          type: string
        battingStyle:
          type: string
          enum: [continuous, nine_man]
          description: |
            Continuous = every player on the roster bats. Nine-man = only the
            top 9 batters get a slot in the order.
        defaultPitchRuleset:
          type: ["string", "null"]
          description: Default pitch-count ruleset key for new tournaments. See pitch-rules.ts catalog.
        defaultAgeGroup:
          type: ["string", "null"]
          description: Free-text team age group label (e.g. "10U", "11-12U").
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - teamName
        - teamShortName
        - battingStyle
        - createdAt
        - updatedAt

    UpdateTeamSettingsBody:
      type: object
      properties:
        teamName:
          type: string
          minLength: 1
          maxLength: 80
        teamShortName:
          type: string
          minLength: 1
          maxLength: 20
        battingStyle:
          type: string
          enum: [continuous, nine_man]
        defaultPitchRuleset:
          type: ["string", "null"]
        defaultAgeGroup:
          type: ["string", "null"]

    UserPreferences:
      type: object
      properties:
        userId:
          type: string
        defaultInnings:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsPerPosition:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsBench:
          type: integer
          minimum: 0
          maximum: 15
        defaultEnsureAllPositions:
          type: boolean
        defaultPitcherRotation:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - userId
        - defaultInnings
        - defaultMaxInningsPerPosition
        - defaultMaxInningsBench
        - defaultEnsureAllPositions
        - defaultPitcherRotation
        - createdAt
        - updatedAt

    Tournament:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pitchCountRuleset:
          type: ["string", "null"]
          description: Ruleset key (see pitch-rules catalog). Null = inherit team default.
        dailyPitchMax:
          type: ["integer", "null"]
          description: Override daily pitch maximum. Null = use ruleset default.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - startDate
        - endDate
        - createdAt

    TournamentSummary:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            gameCount:
              type: integer
            pitchersUsed:
              type: integer
              description: Distinct player count with at least one recorded pitch in this tournament
            totalPitches:
              type: integer
              description: Sum of pitches across all games in this tournament
          required:
            - gameCount
            - pitchersUsed
            - totalPitches

    TournamentDetail:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            games:
              type: array
              items:
                $ref: "#/components/schemas/Game"
            pitcherAvailability:
              type: array
              items:
                $ref: "#/components/schemas/PitcherAvailability"
            effectiveRuleset:
              type: string
              description: Ruleset key actually applied (after fallback to team default)
            effectiveDailyMax:
              type: integer
              description: Daily pitch max actually applied (after override + ruleset fallback)
          required:
            - games
            - pitcherAvailability
            - effectiveRuleset
            - effectiveDailyMax

    CreateTournamentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pitchCountRuleset:
          type: ["string", "null"]
        dailyPitchMax:
          type: ["integer", "null"]
      required:
        - name
        - startDate
        - endDate

    UpdateTournamentBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        pitchCountRuleset:
          type: ["string", "null"]
        dailyPitchMax:
          type: ["integer", "null"]

    PitchCount:
      type: object
      properties:
        id:
          type: integer
        gameId:
          type: integer
        playerId:
          type: integer
        pitches:
          type: integer
          minimum: 0
        notes:
          type: ["string", "null"]
        recordedAt:
          type: string
          format: date-time
      required:
        - id
        - gameId
        - playerId
        - pitches
        - recordedAt

    UpsertPitchCountBody:
      type: object
      properties:
        playerId:
          type: integer
        pitches:
          type: integer
          minimum: 0
          maximum: 500
        notes:
          type: ["string", "null"]
      required:
        - playerId
        - pitches

    PitcherAvailability:
      type: object
      description: Per-player pitch totals + remaining-today availability for a tournament.
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        playerNumber:
          type: ["integer", "null"]
        totalPitchesInTournament:
          type: integer
        pitchesToday:
          type: integer
        pitchesAvailableToday:
          type: integer
        dailyMax:
          type: integer
        restingUntil:
          oneOf:
            - type: "null"
            - type: object
              properties:
                availableOn:
                  type: string
                  format: date-time
                fromOutingDate:
                  type: string
                  format: date-time
                fromOutingPitches:
                  type: integer
                daysRest:
                  type: integer
              required:
                - availableOn
                - fromOutingDate
                - fromOutingPitches
                - daysRest
        outings:
          type: array
          items:
            type: object
            properties:
              gameId:
                type: integer
              date:
                type: string
                format: date-time
              pitches:
                type: integer
            required:
              - gameId
              - date
              - pitches
      required:
        - playerId
        - playerName
        - totalPitchesInTournament
        - pitchesToday
        - pitchesAvailableToday
        - dailyMax
        - outings

    UpdatePreferencesBody:
      type: object
      properties:
        defaultInnings:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsPerPosition:
          type: integer
          minimum: 1
          maximum: 15
        defaultMaxInningsBench:
          type: integer
          minimum: 0
          maximum: 15
        defaultEnsureAllPositions:
          type: boolean
        defaultPitcherRotation:
          type: boolean

    PracticeBlock:
      type: object
      description: One time-block within a practice plan (warmup, drill, scrimmage, etc.)
      properties:
        id:
