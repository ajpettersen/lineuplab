      type: object
      properties:
        playerId:
          type: integer
        pitches:
          type: integer
          minimum: 0
          maximum: 500
        notes:
          type: ["string", "null"]
      required:
        - playerId
        - pitches

    PitcherAvailability:
      type: object
      description: Per-player pitch totals + remaining-today availability for a tournament.
      properties:
        playerId:
          type: integer
        playerName:
          type: string
        playerNumber:
          type: ["integer", "null"]
        totalPitchesInTournament:
          type: integer
        pitchesToday:
          type: integer
        pitchesAvailableToday:
          type: ["integer", "null"]
          description: |
            Pitches the pitcher may still throw today under the resolved daily cap,
            also clamped by what's left in the tournament cap (so a 75-pitch daily
            cap shrinks to 53 when the pitcher has 47 tournament-pitches on the
            books and the tournament cap is 100). Null when neither cap is
            configured — UI renders as "—" / "no cap" rather than zero. Otherwise
            an integer >= 0.
        pitchesAvailableInTournament:
          type: ["integer", "null"]
          description: |
            Pitches the pitcher may still throw across the rest of this tournament
            (tournament cap minus what's already been thrown). Null when no
            tournament cap is configured.
        dailyMax:
          type: ["integer", "null"]
          description: Resolved daily cap for this tournament. Null = no cap configured.
        restingUntil:
          oneOf:
            - type: "null"
            - type: object
              properties:
                availableOn:
                  type: string
                  format: date-time
                fromOutingDate:
                  type: string
                  format: date-time
                fromOutingPitches:
                  type: integer
                daysRest:
                  type: integer
              required:
                - availableOn
                - fromOutingDate
                - fromOutingPitches
                - daysRest
        outings:
          type: array
          items:
            type: object
            properties:
              gameId:
                type: integer
              date:
                type: string
                format: date-time
              pitches:
                type: integer
            required:
              - gameId
              - date
              - pitches
      required:
        - playerId
        - playerName
        - totalPitchesInTournament
        - pitchesToday
        - pitchesAvailableToday
        - pitchesAvailableInTournament
        - dailyMax
        - outings

    PoolPlayTeam:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
      required: [name]

    PoolPlayGame:
      type: object
      properties:
        id:
          type: string
          description: Stable client-generated UUID so edits round-trip.
          minLength: 1
          maxLength: 64
        home:
          type: string
          minLength: 1
          maxLength: 80
        away:
          type: string
          minLength: 1
          maxLength: 80
        homeScore:
          type: ["integer", "null"]
          minimum: 0
          maximum: 99
        awayScore:
          type: ["integer", "null"]
          minimum: 0
          maximum: 99
        final:
          type: boolean
        scheduledAt:
          type: ["string", "null"]
          format: date-time
          description: |
            Scheduled first-pitch time (ISO 8601 with timezone). Optional —
            extracted from schedule screenshots when visible, or copied
            from the linked real game's date on the live-merge path.
            Drives the "awaiting score" warning when the time has
            passed but the score hasn't been entered.
      required: [id, home, away, homeScore, awayScore, final]

    PoolPlayTiebreakerKey:
      type: string
      enum: [winPct, h2h, runDiff, runsAllowed, runsScored, coinFlip]
      description: |
        Ordered tiebreaker step. `runsAllowed` is inverted internally
        (fewer runs against ranks higher). `coinFlip` is deterministic
        in projections but flagged in the UI so coaches know a real
        coin flip resolves it on game day.

    PoolPlay:
      type: object
      description: Saved pool-play import for a tournament.
      properties:
        ourTeamName:
          type: string
          description: Which team in the pool is the coach's. Highlighted in the UI.
        teams:
          type: array
          minItems: 2
          maxItems: 16
          items:
            $ref: "#/components/schemas/PoolPlayTeam"
        games:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/PoolPlayGame"
        tiebreaker:
          type: string
          enum: [winPct_h2h_runDiff, winPct_runDiff_h2h, winPct_h2h]
          description: |
            LEGACY tiebreaker enum, kept optional so old rows still
            round-trip. New writes should send `tiebreakers` instead.
        tiebreakers:
          type: array
          minItems: 1
          maxItems: 8
          description: |
            Ordered tiebreaker chain. First entry is the primary sort;
            subsequent entries break ties within equal-primary subgroups.
            Required on new writes.
          items:
            $ref: "#/components/schemas/PoolPlayTiebreakerKey"
        advanceCount:
          type: integer
          minimum: 1
          maximum: 8
          description: How many teams advance from the pool (default 2).
        byeCount:
          type: integer
          minimum: 0
          maximum: 8
          description: |
            How many of the advancing teams earn a bracket bye (default 0).
            Capped by `advanceCount`.
        updatedAt:
          type: string
      required:
        - ourTeamName
        - teams
        - games
        - tiebreakers
        - advanceCount
        - byeCount
        - updatedAt

    PoolPlayChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1
          maxLength: 4000
      required: [role, content]

    PoolPlayChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/PoolPlayChatMessage"
      required: [messages]

    PoolPlayChatResponse:
      type: object
      description: One assistant turn. `parsedFormat` is null until the AI has enough signal to propose a format.
      properties:
        reply:
          type: string
          description: Assistant's plain-English response shown in the chat thread.
        parsedFormat:
          oneOf:
            - $ref: "#/components/schemas/ExtractedPoolPlayFormat"
            - type: "null"
      required: [reply, parsedFormat]

    ExtractedPoolPlayFormat:
      type: object
      description: |
        AI-parsed seeding/tiebreaker rules from a screenshot of the
        tournament's posted rules. All fields nullable — the coach
        confirms before the format is applied to the saved pool play.
      properties:
        advanceCount:
          type: ["integer", "null"]
          minimum: 1
          maximum: 8
        byeCount:
          type: ["integer", "null"]
          minimum: 0
          maximum: 8
        teamCount:
          type: ["integer", "null"]
          minimum: 2
          maximum: 16
          description: Total teams in the pool/bracket, if visible.
        tiebreakers:
          type: ["array", "null"]
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/PoolPlayTiebreakerKey"
        notes:
          type: ["string", "null"]
          description: Free-form summary of anything the AI noticed but couldn't structure.
      required: [advanceCount, byeCount, teamCount, tiebreakers, notes]

    ExtractedPoolPlay:
      type: object
      description: Best-effort AI-extracted preview. May be incomplete; the coach edits before saving.
      properties:
        ourTeamGuess:
          type: ["string", "null"]
          description: Best guess at which team belongs to the coach (may be null if no signal).
        teams:
          type: array
          items:
            $ref: "#/components/schemas/PoolPlayTeam"
        games:
          type: array
          items:
            $ref: "#/components/schemas/PoolPlayGame"
        tiebreakerNote:
          type: ["string", "null"]
          description: Free-text tiebreaker rules visible on the screenshot (informational only).
      required: [teams, games]

    PoolPlayTeamRecord:
      type: object
      properties:
