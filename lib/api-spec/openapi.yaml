openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Baseball Lineup Manager API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: players
    description: Player management
  - name: tournaments
    description: Tournament containers grouping multiple games
  - name: pitchCounts
    description: Per-game per-pitcher pitch count tracking
  - name: games
    description: Game management
  - name: lineups
    description: Lineup management
  - name: stats
    description: Season statistics and fairness metrics
  - name: teamSettings
    description: Per-coach team branding (team name and short name)
  - name: preferences
    description: Per-coach defaults for new games and lineup generation
  - name: practices
    description: Practice plans with AI-generated drill blocks and attendance

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /players:
    get:
      operationId: listPlayers
      tags: [players]
      summary: List all players
      responses:
        "200":
          description: List of players
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Player"
    post:
      operationId: createPlayer
      tags: [players]
      summary: Create a new player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlayerBody"
      responses:
        "201":
          description: Created player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "400":
          description: Invalid input

  /players/{id}:
    get:
      operationId: getPlayer
      tags: [players]
      summary: Get a player by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    patch:
      operationId: updatePlayer
      tags: [players]
      summary: Update a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlayerBody"
      responses:
        "200":
          description: Updated player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        "404":
          description: Not found
    delete:
      operationId: deletePlayer
      tags: [players]
      summary: Delete a player
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games:
    get:
      operationId: listGames
      tags: [games]
      summary: List all games
      responses:
        "200":
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Game"
    post:
      operationId: createGame
      tags: [games]
      summary: Create a new game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameBody"
      responses:
        "201":
          description: Created game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"

  /games/{id}:
    get:
      operationId: getGame
      tags: [games]
      summary: Get a game by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    patch:
      operationId: updateGame
      tags: [games]
      summary: Update a game (e.g. mark as completed, set score)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGameBody"
      responses:
        "200":
          description: Updated game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
    delete:
      operationId: deleteGame
      tags: [games]
      summary: Delete a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/snapshot-plan:
    post:
      operationId: snapshotPlan
      tags: [games]
      summary: Snapshot the currently-saved lineup as the planned lineup
      description: Used by the post-game photo override flow when the coach picks "Keep original as plan" before replacing the saved lineup with what actually happened.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated game with planSnapshot populated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found
        "409":
          description: No lineup to snapshot
    delete:
      operationId: clearPlanSnapshot
      tags: [games]
      summary: Clear the plan snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated game with planSnapshot cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
        "404":
          description: Not found

  /games/{id}/lineup:
    get:
      operationId: getGameLineup
      tags: [lineups]
      summary: Get the lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lineup entries for game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"
        "404":
          description: Not found

  /games/{id}/lineup/generate:
    post:
      operationId: generateLineup
      tags: [lineups]
      summary: Generate a fair lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateLineupBody"
      responses:
        "200":
          description: Generated lineup entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"
        "400":
          description: Not enough players or constraints cannot be satisfied

  /games/{id}/lineup/save:
    post:
      operationId: saveLineup
      tags: [lineups]
      summary: Save (or replace) the lineup for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLineupBody"
      responses:
        "200":
          description: Saved lineup entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineupEntry"

  /stats/season:
    get:
      operationId: getSeasonStats
      tags: [stats]
      summary: Get season-wide playing time and position fairness stats
      responses:
        "200":
          description: Season stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonStats"

  /stats/players:
    get:
      operationId: getPlayerStats
      tags: [stats]
      summary: Get per-player stats across the season
      responses:
        "200":
          description: Per-player stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerStats"

  /team-settings:
    get:
      operationId: getTeamSettings
      tags: [teamSettings]
      summary: Get the current coach's team branding (auto-creates defaults on first read)
      responses:
        "200":
          description: Team settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
    patch:
      operationId: updateTeamSettings
      tags: [teamSettings]
      summary: Update the current coach's team branding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamSettingsBody"
      responses:
        "200":
          description: Updated team settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSettings"
        "400":
          description: Invalid input

  /tournaments:
    get:
      operationId: listTournaments
      tags: [tournaments]
      summary: List the coach's tournaments (most recent first)
      responses:
        "200":
          description: Tournaments with rolling stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TournamentSummary"
    post:
      operationId: createTournament
      tags: [tournaments]
      summary: Create a tournament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTournamentBody"
      responses:
        "201":
          description: Created tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"

  /tournaments/{id}:
    get:
      operationId: getTournament
      tags: [tournaments]
      summary: Get a tournament with its games and per-pitcher availability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tournament detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TournamentDetail"
        "404":
          description: Not found
    patch:
      operationId: updateTournament
      tags: [tournaments]
      summary: Update a tournament
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTournamentBody"
      responses:
        "200":
          description: Updated tournament
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tournament"
        "404":
          description: Not found
    delete:
      operationId: deleteTournament
      tags: [tournaments]
      summary: Delete a tournament (linked games are detached, not deleted)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/pitch-counts:
    get:
      operationId: getGamePitchCounts
      tags: [pitchCounts]
      summary: Get all pitch counts recorded for a game
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pitch counts for the game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PitchCount"
    post:
      operationId: upsertGamePitchCount
      tags: [pitchCounts]
      summary: Upsert a player's pitch count for this game (one row per game+player)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertPitchCountBody"
      responses:
        "200":
          description: Upserted pitch count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PitchCount"

  /games/{gameId}/pitch-counts/{playerId}:
    delete:
      operationId: deleteGamePitchCount
      tags: [pitchCounts]
      summary: Delete a player's pitch count for this game
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: integer
        - name: playerId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /games/{id}/box-score:
    get:
      operationId: getBoxScore
      tags: [games]
      summary: Get the saved batting + pitching lines for a game
      description: Returns the per-(game, player) batting lines and pitch counts saved from any prior box-score import, plus the game's stored final score and the import timestamp. Use to show the import dialog's "Already imported on …" banner and pre-fill the editable preview when a coach re-opens an already-imported game.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Box score state for the game
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoxScoreState"
        "404":
          description: Game not found
    post:
      operationId: saveBoxScore
      tags: [games]
      summary: Commit edited box-score lines for a game (idempotent per game)
      description: Replaces all per-game batting lines for this game with the supplied rows, upserts pitch counts (one row per pitcher), updates the game's final score, and stamps the import timestamp. Re-posting the same game wipes the prior batting lines first so totals never double-count.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveBoxScoreBody"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveBoxScoreResponse"
        "400":
          description: Invalid payload
        "404":
          description: Game not found
    delete:
      operationId: deleteBoxScore
      tags: [games]
      summary: Clear the box-score import for a game
      description: Removes all per-game batting lines and clears the import timestamp. Pitch counts and the stored final score are intentionally left intact so the coach decides what to revert.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared
        "404":
          description: Game not found

  /games/{id}/box-score/extract:
    post:
      operationId: extractBoxScore
      tags: [games]
      summary: Extract batting + pitching lines from box-score images via AI
      description: Accepts 1–4 phone screenshots or PDFs of a box score (GameChanger or any scorebook). The AI matches names to the team's roster and returns a preview payload (batting lines, pitching lines, final score). Does NOT write to the database — the coach edits the preview and then POSTs `/box-score` to commit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  description: 1–4 image (PNG/JPEG/WebP) or PDF files, ≤6 MB each
                  items:
                    type: string
                    format: binary
              required:
                - files
      responses:
        "200":
          description: Extracted preview (not yet saved)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractedBoxScore"
        "400":
          description: No files uploaded or roster is empty
        "404":
          description: Game not found
        "422":
          description: AI returned malformed response
        "502":
          description: AI extraction failed

  /practices:
    get:
      operationId: listPractices
      tags: [practices]
      summary: List practice plans (most recent first), with attendance roll-ups
      responses:
        "200":
          description: Practices with attendance roll-ups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeSummary"
    post:
      operationId: createPractice
      tags: [practices]
      summary: Create a practice (blocks default to empty until coach generates or adds)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePracticeBody"
      responses:
        "201":
          description: Created practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"

  /practices/{id}:
    get:
      operationId: getPractice
      tags: [practices]
      summary: Get a practice with its blocks and per-player attendance
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Practice detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeDetail"
        "404":
          description: Not found
    patch:
      operationId: updatePractice
      tags: [practices]
      summary: Update a practice's metadata or replace its blocks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePracticeBody"
      responses:
        "200":
          description: Updated practice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Practice"
        "404":
          description: Not found
    delete:
      operationId: deletePractice
      tags: [practices]
      summary: Delete a practice (attendance cascades)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /practices/{id}/attendance:
    put:
      operationId: replacePracticeAttendance
      tags: [practices]
      summary: Bulk-upsert per-player attendance for a practice
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceAttendanceBody"
      responses:
        "200":
          description: Updated attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PracticeAttendance"
        "404":
          description: Not found

  /practices/{id}/generate-plan:
    post:
      operationId: generatePracticePlan
      tags: [practices]
      summary: AI-generate a time-blocked plan from focus areas + duration
      description: |
        Calls OpenAI with the active roster, focus areas, and duration, and
        returns a proposed `blocks` array. Does NOT save the plan — the coach
        reviews + saves via PATCH /practices/{id}.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratePracticePlanBody"
      responses:
        "200":
          description: Proposed plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedPracticePlan"
        "404":
          description: Not found
        "502":
          description: AI service unavailable

  /dashboard/tasks:
    get:
      operationId: listDashboardTasks
      tags: [dashboard]
      summary: Open-task list for the coach dashboard (scores not logged, pitch counts missing)
      description: |
        Derives a fresh list at read time from games + pitch_counts, filtered
        against task_dismissals. Cap of 20 most recent. The list intentionally
        omits dismissed tasks so the dashboard quiets down for accounts the
        coach has triaged.
      responses:
        "200":
          description: Open dashboard tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardTask"

  /dashboard/tasks/dismiss:
    post:
      operationId: dismissDashboardTask
      tags: [dashboard]
      summary: Permanently hide a (game, taskType) pair from the coach's task list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissDashboardTaskBody"
      responses:
        "204":
          description: Dismissed (or already dismissed; idempotent)
        "400":
          description: Invalid request body
        "404":
          description: Game not found

  /preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      summary: Get the current coach's preferences (auto-creates defaults on first read)
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    patch:
      operationId: updatePreferences
      tags: [preferences]
      summary: Update the current coach's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePreferencesBody"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
        "400":
          description: Invalid input

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Player:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Display name "First Last", server-derived from firstName + lastName.
        firstName:
          type: string
        lastName:
          type: string
          description: May be empty for legacy single-token roster rows; new writes require it.
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
          description: List of positions this player can play
        preferredPositions:
          type: array
          items:
            type: string
          description: Player's preferred positions (subset of eligible)
        canPitch:
          type: boolean
        active:
          type: boolean
          description: Whether player is currently on the roster
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - firstName
        - lastName
        - eligiblePositions
        - preferredPositions
        - canPitch
        - active
        - createdAt

    CreatePlayerBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
        preferredPositions:
          type: array
          items:
            type: string
        canPitch:
          type: boolean
        active:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - firstName
        - lastName
        - eligiblePositions
        - preferredPositions
        - canPitch

    UpdatePlayerBody:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        number:
          type: ["integer", "null"]
        eligiblePositions:
          type: array
          items:
            type: string
        preferredPositions:
          type: array
          items:
            type: string
        canPitch:
          type: boolean
        active:
          type: boolean
        notes:
          type: ["string", "null"]
      required:
        - firstName
        - lastName

    Game:
      type: object
      properties:
        id:
          type: integer
        opponent:
          type: string
        gameDate:
          type: string
          format: date-time
        location:
          type: ["string", "null"]
        innings:
          type: integer
          description: Number of innings in the game
        status:
          type: string
          enum: [upcoming, completed, cancelled]
        type:
          type: string
          enum: [game, practice, other]
          description: Event kind — distinguishes games from practices and other team events
        gameType:
          type: ["string", "null"]
          enum: [league, tournament, null]
          description: Competitive context for lineup generation — "tournament" favors competitiveness, "league" rebalances season plate appearances, null falls back to the global equity slider
        ourScore:
          type: ["integer", "null"]
        opponentScore:
          type: ["integer", "null"]
        startedAt:
          type: ["string", "null"]
          format: date-time
          description: Wall-clock time of the actual first pitch (coach taps "Start Game" on the field display). Null until kicked off. Distinct from gameDate (scheduled start) — used by the running game timer.
        tournamentId:
          type: ["integer", "null"]
          description: Optional FK to a tournaments row. Set when the game is part of a multi-game tournament weekend so the app can roll per-pitcher pitch counts across the tournament.
        notes:
          type: ["string", "null"]
        planSnapshot:
          oneOf:
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/PlanSnapshotEntry"
          description: Snapshot of the planned lineup taken before a post-game photo override (null when no snapshot has been taken)
        boxScoreImportedAt:
          type: ["string", "null"]
          format: date-time
          description: Timestamp of the most recent box-score import. Null if no box score has been imported. The UI shows an "Already imported on …" banner when set.
