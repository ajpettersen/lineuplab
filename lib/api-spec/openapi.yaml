          type: integer
        hits:
          type: integer
        doubles:
          type: integer
        triples:
          type: integer
        hr:
          type: integer
        rbi:
          type: integer
        bb:
          type: integer
        k:
          type: integer
        hbp:
          type: integer
        sac:
          type: integer
        sb:
          type: integer
        runs:
          type: integer
      required:
        - playerId
        - ab
        - hits
        - doubles
        - triples
        - hr
        - rbi
        - bb
        - k
        - hbp
        - sac
        - sb
        - runs

    PitchingLine:
      type: object
      description: One pitcher's outing for this game. Persists into `pitch_counts` with a unique (game, player) row.
      properties:
        playerId:
          type: integer
        playerName:
